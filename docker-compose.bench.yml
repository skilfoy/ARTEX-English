# ARTEX Question. TSec Benchmark Evaluation mirror —— Local One build + run.
# Production docker-compose.yml(Multi-service:artex+postgres)It doesn't affect each other..
# Usage:
#   cp bench/.env.example bench/.env   # Fill LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run front desk(Read the log.)
#   docker compose -f docker-compose.bench.yml up --build -d   # Backstage
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop(Add -v Even delete the data roll.)
# Browser:http://localhost:8787(Use ADMIN_PASSWORD Log in)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Network sharing with physics machines: packagings directly using the host grid, with direct connections to the host/VPN The target network..
    # host Not in the pattern. ports Map, container directly bound to host mouth:8787(UI/API),8788(Agent),
    # And inside. PostgreSQL 5432 —— Make sure the three ports are free.).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
