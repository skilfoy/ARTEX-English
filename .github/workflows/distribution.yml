name: Distribution checks

on:
  push:
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detection pack
        run: python3 detections/tests/test_pack.py
      - name: Known-bad image names stay inside the detection pack
        run: python3 scripts/check_supply_chain.py
