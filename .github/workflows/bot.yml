name: bot

# Disabled on this distribution. The script is the BaaRai triage bot and it
# calls an external model. Run it by hand only if that integration is wired up.
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  reply:
    # Issue opening is always handled (the maintainer gets silent labeling,
    # visitors get the full triage). Comments and PRs serve visitors only:
    # never react to the maintainer, to bots, or to itself.
    if: >
      github.event_name == 'issues' ||
      (github.actor != 'BaaRai' &&
       github.actor != 'github-actions[bot]' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: triage or reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash .github/scripts/bot.sh
